
name: Atualizar cartão do perfil

on:
  schedule:
    - cron: "0 */6 * * *"      # roda a cada 6 horas
  workflow_dispatch:            # permite rodar manualmente (aba Actions)
  push:
    branches: [main]
    paths:
      - "scripts/**"            

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar o cartão
        env:
          # Usa o token pessoal (se você criou o segredo PERFIL_TOKEN);
          # caso contrário, usa o token padrão do Actions.
          GH_TOKEN: ${{ secrets.PERFIL_TOKEN || secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: python scripts/gerar_aura.py

      - name: Salvar se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/aura.svg
          git diff --staged --quiet || (git commit -m "chore: atualiza cartão do perfil" && git push)
